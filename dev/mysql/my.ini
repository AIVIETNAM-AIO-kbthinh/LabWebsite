# Private MySQL instance for local development only (port 3307).
# Started by dev/run-local.ps1 - independent from the MySQL84 Windows service.
[mysqld]
basedir="C:/Program Files/MySQL/MySQL Server 8.4"
datadir="G:/LabWebsite/dev/mysql/data"
port=3307
bind-address=127.0.0.1
mysqlx=OFF
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
log-error="G:/LabWebsite/dev/mysql/mysqld.log"
pid-file="G:/LabWebsite/dev/mysql/mysqld.pid"
